<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat EEMOVEL · IA Imobiliária</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:transparent}

/* ═══ FAB ═══ */
.chat-fab{position:fixed;bottom:24px;right:24px;z-index:9999;width:62px;height:62px;border-radius:50%;background:#fff;border:2.5px solid #1a3bff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s;box-shadow:0 4px 24px rgba(26,59,255,.3);animation:fpulse 2.5s infinite}
.chat-fab:hover{transform:scale(1.08);box-shadow:0 6px 32px rgba(26,59,255,.4)}
.chat-fab img{width:36px;height:36px;object-fit:contain}
.chat-fab svg{width:26px;height:26px;fill:#1a3bff}
.chat-fab.open{animation:none}
@keyframes fpulse{0%,100%{box-shadow:0 4px 24px rgba(26,59,255,.3),0 0 0 0 rgba(26,59,255,.2)}50%{box-shadow:0 4px 24px rgba(26,59,255,.3),0 0 0 10px rgba(26,59,255,0)}}

/* ═══ WINDOW ═══ */
.chat-win{position:fixed;bottom:96px;right:24px;z-index:9998;width:400px;max-width:calc(100vw - 32px);max-height:min(700px,calc(100vh - 120px));border-radius:20px;overflow:hidden;background:#fff;display:flex;flex-direction:column;box-shadow:0 12px 60px rgba(0,0,0,.15),0 0 0 1px rgba(0,0,0,.04);opacity:0;transform:translateY(16px) scale(.96);pointer-events:none;transition:opacity .3s,transform .3s}
.chat-win.vis{opacity:1;transform:translateY(0) scale(1);pointer-events:all}

/* ═══ HEADER ═══ */
.ch-hdr{background:linear-gradient(135deg,#0d0f1a,#141836);padding:14px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.ch-av{width:38px;height:38px;border-radius:50%;background:#fff;border:2px solid #1a3bff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ch-av img{width:28px;height:28px;object-fit:contain}
.ch-info{flex:1}
.ch-info h3{color:#fff;font-size:14px;font-weight:600}
.ch-info p{color:rgba(255,255,255,.55);font-size:11px;margin-top:1px;display:flex;align-items:center;gap:5px}
.ch-dot{width:6px;height:6px;border-radius:50%;background:#4ade80;display:inline-block;box-shadow:0 0 6px #4ade80}
.ch-rst{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:rgba(255,255,255,.6);font-size:11px;font-family:'DM Sans',sans-serif;padding:5px 10px;cursor:pointer;display:flex;align-items:center;gap:4px;transition:all .15s;flex-shrink:0}
.ch-rst:hover{background:rgba(255,255,255,.15);color:#fff}
.ch-rst svg{width:12px;height:12px;fill:currentColor}

/* ═══ PROGRESS ═══ */
.ch-prog{height:2px;background:#e8ecf1;flex-shrink:0}
.ch-prog-fill{height:100%;background:linear-gradient(90deg,#1a3bff,#4a8bff);transition:width .5s;width:0%}

/* ═══ BODY ═══ */
.ch-body{padding:14px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;background:#f8f9fb;min-height:0}
.ch-body::-webkit-scrollbar{width:4px}
.ch-body::-webkit-scrollbar-thumb{background:#d0d5dd;border-radius:4px}

/* ═══ BUBBLES ═══ */
.brow{display:flex;gap:8px;align-items:flex-end;animation:mIn .3s ease}
.brow.usr{flex-direction:row-reverse}
@keyframes mIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.bico{width:28px;height:28px;border-radius:50%;background:#fff;border:1.5px solid #1a3bff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bico img{width:22px;height:22px;object-fit:contain}
.bbl{max-width:80%;padding:10px 14px;border-radius:16px;font-size:13.5px;line-height:1.6}
.bbl.bot{background:#fff;border:1px solid #e8ecf1;border-bottom-left-radius:4px;color:#1a1d2e;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.bbl.usr{background:linear-gradient(135deg,#1a3bff,#2948ff);color:#fff;border-bottom-right-radius:4px;box-shadow:0 2px 8px rgba(26,59,255,.25)}
.bbl.bot strong{color:#1a3bff;font-weight:600}
.bbl.bot em{color:#1a3bff;font-style:normal;font-weight:500}
.ai-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:#1a3bff;font-weight:500;margin-bottom:4px}
.ai-badge::before{content:'✦';font-size:9px}

/* ═══ OPTIONS ═══ */
.orow{display:flex;flex-wrap:wrap;gap:6px;padding-left:36px}
.ob{background:#fff;border:1.5px solid #d0d5dd;color:#1a1d2e;border-radius:20px;padding:7px 16px;font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .2s;font-weight:500;text-align:left;line-height:1.4}
.ob:hover{background:#1a3bff;color:#fff;border-color:#1a3bff}
.ob:disabled{opacity:.4;cursor:default;pointer-events:none}
.ob.sel{background:#1a3bff;color:#fff;border-color:#1a3bff}
.ob--cta{background:linear-gradient(135deg,#1a3bff,#2948ff);border-color:#1a3bff;color:#fff;font-weight:600;padding:10px 24px;font-size:14px;box-shadow:0 2px 12px rgba(26,59,255,.3)}
.ob--cta:hover{filter:brightness(1.1)}
.cbtn{display:inline-block;margin-top:8px;background:linear-gradient(135deg,#1a3bff,#2948ff);color:#fff;border:none;border-radius:10px;padding:10px 20px;font-size:13px;font-family:'DM Sans',sans-serif;font-weight:600;cursor:pointer;text-decoration:none;transition:all .2s;box-shadow:0 2px 12px rgba(26,59,255,.25)}
.cbtn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.cbtn--sec{background:#f0f2f5;color:#1a1d2e;box-shadow:none;border:1.5px solid #d0d5dd}
.chip{display:inline-block;background:#1a3bff;color:#fff;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;margin-right:4px}
.chipv{color:#1a1d2e;font-size:13px}

/* ═══ FOOTER ═══ */
.ch-ft{border-top:1px solid #e8ecf1;padding:10px 12px;display:flex;gap:8px;align-items:center;background:#fff;flex-shrink:0}
.ch-inp{flex:1;border:1.5px solid #e0e4ea;border-radius:20px;padding:9px 16px;font-size:13.5px;font-family:'DM Sans',sans-serif;background:#f8f9fb;color:#1a1d2e;outline:none;transition:border-color .2s}
.ch-inp:focus{border-color:#1a3bff}
.ch-inp::placeholder{color:#9ca3b0}
.ch-inp:disabled{opacity:.4;cursor:not-allowed}
.ch-send{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#1a3bff,#2948ff);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;box-shadow:0 2px 8px rgba(26,59,255,.25)}
.ch-send:hover{filter:brightness(1.1)}
.ch-send:disabled{opacity:.3;cursor:default}
.ch-send svg{width:15px;height:15px;fill:#fff}

/* ═══ TYPING ═══ */
.tping{display:flex;gap:4px;align-items:center;padding:8px 4px}
.tping span{width:6px;height:6px;border-radius:50%;background:#a0aab8;animation:bk 1.2s infinite}
.tping span:nth-child(2){animation-delay:.2s}
.tping span:nth-child(3){animation-delay:.4s}
@keyframes bk{0%,80%,100%{opacity:.25}40%{opacity:1}}

.err-msg{font-size:12px;color:#ef4444;padding-left:36px;margin-top:-4px}
.hint{font-size:13px;color:#c8860a;font-weight:500}
.hint-arr{display:inline-block;animation:pd 1.2s ease-in-out infinite}
@keyframes pd{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
.pw{text-align:center;padding:6px;font-size:10px;color:#9ca3b0;background:#fff;border-top:1px solid #f0f2f5;flex-shrink:0}
.pw a{color:#1a3bff;text-decoration:none;font-weight:600}

@media(max-width:480px){
  .chat-win{bottom:0;right:0;width:100vw;max-width:100vw;max-height:100vh;border-radius:0}
  .chat-fab{bottom:16px;right:16px}
}
</style>
</head>

<script>
(function(){
'use strict';

const ICON='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTQyIiBoZWlnaHQ9IjE0MiIgdmlld0JveD0iMCAwIDE0MiAxNDIiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxwYXRoIGQ9Ik03Mi4yMiAxMTMuOTU1TDg3LjM3IDI4LjA0NUgxMzQuODRMMTMyLjY3IDQwLjA3NUgxMDIuNTFMOTguMTggNjQuNTA1SDEyNi41TDEyNC40NyA3Ni4wODVIOTYuMTVMOTEuNjMgMTAxLjkyNUgxMjEuNzlMMTE5LjY5IDExMy45NTVINzIuMjJaIiBmaWxsPSIjMGQwZjFhIi8+CjxwYXRoIGQ9Ik03Ni40NTAxIDQwLjA3NUg1Mi43MjAxTDM5LjcxMDEgMTEzLjk1NUg2My40NDAxTDc2LjQ1MDEgNDAuMDc1WiIgZmlsbD0iIzFhM2JmZiIvPgo8cGF0aCBkPSJNMzcuNTUgNzYuMDg1SDEzLjgyTDcuMTYwMDMgMTEzLjk1NUgzMC44OUwzNy41NSA3Ni4wODVaIiBmaWxsPSIjMWEzYmZmIi8+Cjwvc3ZnPgo=';

// ═══ CONFIG WEBHOOK ═══
// Troque pela URL real do seu webhook (Zapier, Make, n8n, HubSpot, etc.)
const WEBHOOK_URL='https://hooks.zapier.com/hooks/catch/SEU_HOOK_AQUI';

const SYSPROMPT=`Você é a IA de atendimento da EEMOVEL. Tire dúvidas sobre ATENDA+ e CONVERTA+.
Direto, confiante, profissional. Português BR. Máximo 3-4 frases.

ATENDA+ (IA Atendimento): Responde leads WhatsApp em <5s, 24/7. IA treinada mercado imobiliário. Qualifica: tipo, região, orçamento, prazo. Corretor assume com 1 clique. Cadências automáticas. Agente captador.

CONVERTA+ (IA Gestão/CRM): Pipeline visual — IA move cards lendo conversas. Distribuição por perfil/região/histórico. Follow-up proativo. Histórico completo. Analytics por corretor.

JUNTOS: Lead chega → ATENDA+ responde → qualifica → CONVERTA+ distribui → Corretor fecha → IA atualiza pipeline → Follow-up automático.

NÚMEROS: +14k corretores, +2k imobiliárias, 11 anos, R$1,5bi VGV.

REGRAS: Preço → demo gratuita personalizada. Agendar → time já recebeu dados, contato em 24h. Outros produtos → explique brevemente. Não invente. Máx 1 emoji.`;

// ═══ STATE ═══
const $=id=>document.getElementById(id);
const bd=$('body');
let step='0',ud={},logs=[],aiMode=false,aiHist=[];

// ═══ TOGGLE ═══
window.toggleChat=function(){
  const w=$('win'),open=w.classList.contains('vis');
  w.classList.toggle('vis');$('fab').classList.toggle('open');
  $('fabImg').style.display=open?'block':'none';
  $('fabX').style.display=open?'none':'block';
  if(!open)scr();
};

function greet(){const h=new Date().getHours();return h>=5&&h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';}
function prog(p){$('prog').style.width=p+'%';}
function scr(){setTimeout(()=>bd.scrollTop=bd.scrollHeight,60);}
function icoHTML(){return '<div class="bico"><img src="'+ICON+'" alt="E"/></div>';}
function dis(){const i=$('inp'),b=$('sendBtn');if(i)i.disabled=true;if(b)b.disabled=true;}
function en(ph){const i=$('inp'),b=$('sendBtn');if(i){i.disabled=false;if(ph)i.placeholder=ph;setTimeout(()=>i.focus(),100);}if(b)b.disabled=false;}
function rmErr(){const e=$('errM');if(e)e.remove();}
function showErr(m){rmErr();const e=document.createElement('div');e.className='err-msg';e.id='errM';e.textContent=m;bd.appendChild(e);scr();}
function lg(r,t){logs.push({role:r,text:t.replace(/<[^>]+>/g,''),time:new Date().toISOString()});}
function strip(h){const d=document.createElement('div');d.innerHTML=h;return d.textContent;}

function addBot(html,ai){
  const pfx=ai?'<div class="ai-badge">IA EEMOVEL</div>':'';
  const r=document.createElement('div');r.className='brow';
  r.innerHTML=icoHTML()+'<div class="bbl bot">'+pfx+html+'</div>';
  bd.appendChild(r);lg('bot',html);scr();
}
function addUsr(t){
  const r=document.createElement('div');r.className='brow usr';
  r.innerHTML='<div class="bbl usr">'+t+'</div>';
  bd.appendChild(r);lg('user',t);scr();
}
function addTyping(){
  const r=document.createElement('div');r.className='brow';r.id='tpng';
  r.innerHTML=icoHTML()+'<div class="bbl bot"><div class="tping"><span></span><span></span><span></span></div></div>';
  bd.appendChild(r);scr();
}
function rmTyping(){const t=$('tpng');if(t)t.remove();}

function delay(ms){return new Promise(r=>setTimeout(r,ms));}
async function botReply(fn){dis();addTyping();await delay(800);rmTyping();await fn();scr();}

// ═══ OPTIONS ═══
function addOpts(list,cb){
  const row=document.createElement('div');row.className='orow';
  list.forEach(o=>{
    const b=document.createElement('button');b.className='ob';b.innerHTML=o;
    b.onclick=function(){row.querySelectorAll('.ob').forEach(x=>x.disabled=true);addUsr(strip(o));row.remove();cb(o);};
    row.appendChild(b);
  });
  bd.appendChild(row);scr();
}

function addCTA(label,cb){
  const row=document.createElement('div');row.className='orow';
  const b=document.createElement('button');b.className='ob ob--cta';b.innerHTML=label;
  b.onclick=function(){b.disabled=true;addUsr(strip(label));row.remove();cb();};
  row.appendChild(b);bd.appendChild(row);scr();
}

function addMulti(list,cb){
  const sel=new Set();
  const wrap=document.createElement('div');wrap.style.cssText='display:flex;flex-direction:column;gap:8px;padding-left:36px';
  const row=document.createElement('div');row.style.cssText='display:flex;flex-wrap:wrap;gap:6px';
  const cfm=document.createElement('button');cfm.className='ob';cfm.style.cssText='background:#1a3bff;color:#fff;border-color:#1a3bff;opacity:.4;cursor:default';cfm.innerHTML='Confirmar →';cfm.disabled=true;
  list.forEach(o=>{
    const b=document.createElement('button');b.className='ob';b.innerHTML=o;
    b.onclick=function(){
      if(sel.has(o)){sel.delete(o);b.classList.remove('sel');}
      else{sel.add(o);b.classList.add('sel');}
      cfm.disabled=sel.size===0;cfm.style.opacity=sel.size?'1':'.4';cfm.style.cursor=sel.size?'pointer':'default';
    };
    row.appendChild(b);
  });
  cfm.onclick=function(){
    if(!sel.size)return;
    wrap.querySelectorAll('.ob').forEach(x=>x.disabled=true);
    const c=[...sel];addUsr(c.map(strip).join(', '));wrap.remove();cb(c);
  };
  wrap.appendChild(row);wrap.appendChild(cfm);bd.appendChild(wrap);scr();
}

// ═══ WEBHOOK ═══
async function sendLead(data){
  const payload={...data,chatLog:logs,source:'chat-eemovel-jornada-atendimento',url:location.href,timestamp:new Date().toISOString(),ua:navigator.userAgent};
  console.log('%c📨 LEAD CAPTURADO','color:#1a3bff;font-weight:bold',JSON.stringify(payload,null,2));
  if(WEBHOOK_URL && !WEBHOOK_URL.includes('SEU_HOOK')){
    try{await fetch(WEBHOOK_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});console.log('✅ Lead enviado ao webhook');}
    catch(e){console.error('❌ Webhook error:',e);}
  }
  try{window.dispatchEvent(new CustomEvent('eemovel-lead',{detail:payload}));}catch(e){}
}

// ═══ IA ═══
async function askAI(msg){
  aiHist.push({role:'user',content:msg});
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:600,system:SYSPROMPT,messages:aiHist.slice(-10)})
    });
    if(!r.ok) throw new Error('Status '+r.status);
    const d=await r.json();
    const t=d.content&&d.content.map(b=>b.type==='text'?b.text:'').filter(Boolean).join('')||'Tive uma dificuldade técnica. Tente novamente!';
    aiHist.push({role:'assistant',content:t});return t;
  }catch(e){
    console.error('AI error:',e);
    return 'Desculpe, estou com uma dificuldade técnica no momento. Fale com nosso time pelo WhatsApp: <strong>(45) 9 9817-0318</strong> 📱';
  }
}

// ═══ SEND HANDLER ═══
function handleSend(){
  const i=$('inp');if(!i||i.disabled)return;
  const v=i.value.trim();if(!v)return;rmErr();

  if(aiMode){addUsr(v);i.value='';doAI(v);return;}

  switch(step){
    case '1':
      if(v.split(' ').filter(Boolean).length<2){showErr('⚠ Informe nome e sobrenome.');return;}
      ud.nome=v;addUsr(v);i.value='';goNext('2');break;
    case '2':
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){showErr('⚠ Informe um e-mail válido.');return;}
      ud.email=v;addUsr(v);i.value='';goNext('3');break;
    case '3':
      var raw=v.replace(/\D/g,'');if(raw.length!==2){showErr('⚠ DDD deve ter 2 dígitos.');return;}
      ud.ddd=raw;addUsr(v);i.value='';goNext('3.5');break;
    case '3.5':
      var raw2=v.replace(/\D/g,'');if(raw2.length<8||raw2.length>9){showErr('⚠ Número deve ter 8 ou 9 dígitos.');return;}
      ud.fone=raw2;ud.whatsapp='('+ud.ddd+') '+raw2.slice(0,raw2.length-4)+'-'+raw2.slice(-4);
      addUsr(v);i.value='';goNext('3.6');break;
  }
}

async function doAI(msg){
  dis();addTyping();

}
